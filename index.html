<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Pagoda Garden</title>
    <style>
      :root {
        --ink: #33413a;
        --ink-soft: #7c867e;
        --card: rgba(255, 255, 255, 0.82);
        --line: rgba(51, 65, 58, 0.1);
        --accent: #bf4a31;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background: #f2f3ee;
        overflow: hidden;
      }
      #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      .card {
        position: fixed; top: 20px; left: 20px; width: 244px;
        background: var(--card);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 18px;
        box-shadow: 0 10px 30px rgba(60, 70, 60, 0.1);
        user-select: none;
      }
      .title { font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }
      .subtitle {
        margin-top: 3px; font-size: 10.5px; color: var(--ink-soft);
        text-transform: uppercase; letter-spacing: 0.14em;
      }
      .stats { display: flex; gap: 8px; margin: 14px 0 12px; }
      .stat {
        flex: 1; text-align: center; padding: 8px 4px;
        background: rgba(51, 65, 58, 0.05); border-radius: 10px;
      }
      .stat span {
        display: block; font-size: 15px; font-weight: 620;
        font-variant-numeric: tabular-nums;
      }
      .stat label {
        display: block; margin-top: 2px; font-size: 9px; color: var(--ink-soft);
        text-transform: uppercase; letter-spacing: 0.09em;
      }
      .buttons { display: flex; gap: 8px; }
      .buttons button {
        flex: 1; font: inherit; font-size: 11px; padding: 7px 6px;
        color: var(--ink); background: #fff;
        border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .buttons button:hover { border-color: rgba(51, 65, 58, 0.28); }
      .buttons button.active {
        background: var(--accent); border-color: var(--accent); color: #fff;
      }
      #hint {
        position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
        padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
        background: var(--card);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 6px 18px rgba(60, 70, 60, 0.08);
        font-size: 11.5px; color: var(--ink-soft); white-space: nowrap;
        user-select: none;
      }
      @media (max-width: 560px) {
        .card { width: calc(100vw - 40px); }
        #hint { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <aside class="card" aria-label="Dashboard">
      <div class="title">Voxel Pagoda Garden</div>
      <div class="subtitle">Three.js &middot; voxel diorama</div>
      <div class="stats">
        <div class="stat"><span id="stat-voxels">&ndash;</span><label>voxels</label></div>
        <div class="stat"><span id="stat-fps">&ndash;</span><label>fps</label></div>
        <div class="stat"><span id="stat-draws">&ndash;</span><label>draws</label></div>
      </div>
      <div class="buttons">
        <button id="btn-rotate" class="active" aria-pressed="true">Auto-rotate</button>
        <button id="btn-reset">Reset view</button>
        <button id="btn-dusk" aria-pressed="false">Dusk</button>
      </div>
    </aside>

    <div id="hint">Drag to orbit &middot; Scroll to zoom &middot; Right-drag to pan</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
